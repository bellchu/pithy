<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Pithy</title>
  <desc id="desc">Quiet workflow control for Codex: selective exploration, evidence verification, and structural replanning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B18"/>
      <stop offset="0.48" stop-color="#15112E"/>
      <stop offset="1" stop-color="#061725"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C4B5FD" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="34" fill="url(#grid)"/>
  <ellipse cx="600" cy="220" rx="520" ry="300" fill="url(#glow)"/>
  <path d="M74 78H1126" stroke="url(#accent)" stroke-width="2" stroke-opacity=".65"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(74 48)">
      <rect width="206" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#C4B5FD" stroke-opacity=".25"/>
      <circle cx="20" cy="17" r="5" fill="#22D3EE"/>
      <text x="36" y="22" fill="#DDD6FE" font-size="12" font-weight="700" letter-spacing="1.7">CODEX WORKFLOW</text>
    </g>

    <text x="600" y="214" text-anchor="middle" fill="#F8FAFC" font-size="108" font-weight="800" letter-spacing="15">PITHY</text>
    <rect x="382" y="238" width="436" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="600" y="282" text-anchor="middle" fill="#C4B5FD" font-size="22" font-weight="500" letter-spacing="1.1">QUIET DECISIONS · GROUNDED EVIDENCE · CLEAN RECOVERY</text>

    <path d="M318 374H882" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-opacity=".68"/>
    <g filter="url(#shadow)">
      <g transform="translate(124 328)">
        <rect width="262" height="94" rx="20" fill="#0F172A" fill-opacity=".9" stroke="#A78BFA" stroke-opacity=".55"/>
        <circle cx="32" cy="29" r="9" fill="#A78BFA"/>
        <text x="52" y="34" fill="#F5F3FF" font-size="16" font-weight="750">SELECTIVE EXPLORE</text>
        <text x="32" y="65" fill="#A5B4FC" font-size="13">Only when the decision can change</text>
      </g>
      <g transform="translate(469 328)">
        <rect width="262" height="94" rx="20" fill="#0F172A" fill-opacity=".94" stroke="#8B5CF6" stroke-opacity=".72"/>
        <circle cx="32" cy="29" r="9" fill="#8B5CF6"/>
        <text x="52" y="34" fill="#F5F3FF" font-size="16" font-weight="750">EVIDENCE VERIFY</text>
        <text x="32" y="65" fill="#A5B4FC" font-size="13">Reuse proof; skip equivalent checks</text>
      </g>
      <g transform="translate(814 328)">
        <rect width="262" height="94" rx="20" fill="#0F172A" fill-opacity=".9" stroke="#22D3EE" stroke-opacity=".58"/>
        <circle cx="32" cy="29" r="9" fill="#22D3EE"/>
        <text x="52" y="34" fill="#ECFEFF" font-size="16" font-weight="750">STRUCTURAL REPLAN</text>
        <text x="32" y="65" fill="#A5F3FC" font-size="13">Stop safely before crossing bounds</text>
      </g>
    </g>

    <text x="74" y="466" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.5">BRIEF BY DESIGN</text>
    <text x="1126" y="466" text-anchor="end" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.5">COMPLETE BY EVIDENCE</text>
  </g>
</svg>
